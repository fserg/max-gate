[project]
name = "maxgate"
version = "0.1.0"
description = "MAX ↔ Telegram Gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "maxapi-python==2.4.1",
  "aiogram==3.26.0",
  "pydantic-settings>=2.10,<3",
  "cryptography>=46,<47",
  "SQLAlchemy>=2.0,<2.1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "streamlit==1.54.0",
  "streamlit-shadcn-ui>=0.1.19",
]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8", "pytest-asyncio>=1"]

[project.scripts]
maxgate = "maxgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
